<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2100" width="1440" height="2100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
      .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .gold-grad { fill: url(#goldGradient); }
      .card-shadow { filter: drop-shadow(0 4px 12px rgba(45,33,23,0.06)); }
    </style>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B58B1E" />
      <stop offset="50%" stop-color="#D8B244" />
      <stop offset="100%" stop-color="#9B7414" />
    </linearGradient>
  </defs>

  <rect width="1440" height="2100" fill="#FCFBF7" />

  <!-- Navbar -->
  <g id="Navbar" transform="translate(0, 0)">
    <rect width="1440" height="84" fill="#FCFBF7" />
    <line x1="0" y1="84" x2="1440" y2="84" stroke="#EAE3D9" stroke-width="1" />
    <g transform="translate(80, 22)">
      <circle cx="20" cy="20" r="18" fill="#F4E8C1" />
      <path d="M20 10 C21.5 13.5 24 16.5 24 19 C24 22 22 24.5 20 24.5 C18 24.5 16 22 16 19 C16 16.5 18.5 13.5 20 10 Z" fill="#C59B27" />
      <text x="50" y="22" class="serif" font-size="22" font-weight="700" fill="#231B15" letter-spacing="2">LIVE LOVE LIGHT</text>
      <text x="52" y="34" class="sans" font-size="8.5" font-weight="600" fill="#9A7513" letter-spacing="3">HANDCRAFTED CANDLES</text>
    </g>
    <g transform="translate(600, 48)" class="sans" font-size="13" font-weight="600" fill="#786C63" letter-spacing="1.5">
      <text x="0" y="0">COLLECTION</text>
      <text x="120" y="0" fill="#C59B27">OUR STORY</text>
      <text x="240" y="0">CANDLE CARE</text>
      <text x="360" y="0">CONTACT</text>
    </g>
    <g transform="translate(1220, 24)">
      <rect x="0" y="0" width="120" height="36" rx="18" fill="#231B15" />
      <text x="60" y="23" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#FCFBF7">My Account</text>
    </g>
  </g>

  <!-- Hero Header -->
  <g id="About-Hero" transform="translate(0, 84)">
    <rect width="1440" height="320" fill="#F6F1EC" />
    <line x1="0" y1="320" x2="1440" y2="320" stroke="#EAE3D9" />
    
    <g transform="translate(720, 70)" text-anchor="middle">
      <rect x="-130" y="0" width="260" height="28" rx="14" fill="#F4E8C1" stroke="#D9C38F" />
      <text x="0" y="18" class="sans" font-size="10.5" font-weight="700" fill="#9A7513" letter-spacing="1.5">✦ THE LIVE LOVE LIGHT ESSENCE</text>
      
      <text x="0" y="90" class="serif" font-size="54" font-weight="700" fill="#231B15">Light Something Beautiful</text>
      <text x="0" y="135" class="sans" font-size="16" fill="#786C63" width="700">
        Live Love Light was founded on a simple devotion: to create handcrafted candles
      </text>
      <text x="0" y="160" class="sans" font-size="16" fill="#786C63">
        that awaken peace, romance, and warm beauty in everyday spaces.
      </text>
    </g>
  </g>

  <!-- Story Section 1: Artisan Roots -->
  <g id="Artisan-Roots" transform="translate(120, 460)">
    <g transform="translate(0, 30)">
      <text x="0" y="0" class="sans" font-size="11" font-weight="700" fill="#9A7513" letter-spacing="2">ARTISANAL ROOTS</text>
      <text x="0" y="40" class="serif" font-size="38" font-weight="700" fill="#231B15">Sculpted Petal by Petal</text>
      <text x="0" y="80" class="sans" font-size="15" fill="#786C63" width="540">
        <tspan x="0" dy="0">Unlike mass factory candles that rely on industrial paraffin and synthetic</tspan>
        <tspan x="0" dy="26">scent blends, every single Live Love Light piece begins with pure</tspan>
        <tspan x="0" dy="26">botanical soy wax. Our floral designs — from blooming daisies to delicate</tspan>
        <tspan x="0" dy="26">peonies — are sculpted and poured with obsessive human precision.</tspan>
      </text>
      <text x="0" y="210" class="sans" font-size="15" fill="#786C63">
        Our wicks are carefully calibrated lead-free cotton wicks that guarantee
      </text>
      <text x="0" y="236" class="sans" font-size="15" fill="#786C63">
        a soothing, smokeless, and toxic-free burn in every room.
      </text>
    </g>

    <!-- Visual Artwork Frame -->
    <g transform="translate(640, 0)" class="card-shadow">
      <rect width="560" height="340" rx="24" fill="#F6F1EC" stroke="#EAE3D9" stroke-width="1.5" />
      <circle cx="280" cy="170" r="110" fill="#EBE3D7" />
      <text x="280" y="165" text-anchor="middle" class="serif" font-size="24" font-weight="700" fill="#231B15">HANDMADE WITH DEVOTION</text>
      <text x="280" y="195" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#9A7513" letter-spacing="2">100% BOTANICAL SOY WAX</text>
    </g>
  </g>

  <!-- Purity Comparison: Soy vs Paraffin -->
  <g id="Purity-Comparison" transform="translate(120, 880)">
    <text x="600" y="0" text-anchor="middle" class="serif" font-size="36" font-weight="700" fill="#231B15">
      The Purity Difference
    </text>
    <text x="600" y="30" text-anchor="middle" class="sans" font-size="14" fill="#786C63">
      Why choosing botanical soy transforms your indoor wellness and air quality
    </text>

    <!-- Card A: Live Love Light Soy Wax -->
    <g transform="translate(60, 70)" class="card-shadow">
      <rect width="500" height="360" rx="20" fill="#FFFFFF" stroke="#C59B27" stroke-width="2" />
      <rect x="0" y="0" width="500" height="60" rx="20" fill="#F4E8C1" />
      <text x="30" y="38" class="sans" font-size="16" font-weight="700" fill="#9A7513">
        ✦ LIVE LOVE LIGHT BOTANICAL SOY WAX
      </text>
      
      <g transform="translate(30, 95)" class="sans" font-size="13.5" fill="#231B15">
        <text x="0" y="0">✓ <tspan font-weight="600">100% Plant-Based &amp; Renewable</tspan> — zero petroleum byproducts</text>
        <text x="0" y="45">✓ <tspan font-weight="600">Clean, Smokeless Burn</tspan> — non-toxic to pets, children &amp; lungs</text>
        <text x="0" y="90">✓ <tspan font-weight="600">50% Longer Burn Time</tspan> — melts cooler and lasts up to 50 hours</text>
        <text x="0" y="135">✓ <tspan font-weight="600">Subtle Fragrance Diffusion</tspan> — authentic luxury essential oils</text>
        <text x="0" y="180">✓ <tspan font-weight="600">Biodegradable &amp; Easy Wash</tspan> — washes with gentle warm soap</text>
      </g>
    </g>

    <!-- Card B: Conventional Factory Paraffin Wax -->
    <g transform="translate(640, 70)">
      <rect width="500" height="360" rx="20" fill="#FFFFFF" stroke="#EAE3D9" stroke-width="1.5" />
      <rect x="0" y="0" width="500" height="60" rx="20" fill="#F6F1EC" />
      <text x="30" y="38" class="sans" font-size="16" font-weight="700" fill="#786C63">
        ✕ CONVENTIONAL FACTORY PARAFFIN WAX
      </text>

      <g transform="translate(30, 95)" class="sans" font-size="13.5" fill="#786C63">
        <text x="0" y="0">✗ Petroleum derivative produced during crude oil refining</text>
        <text x="0" y="45">✗ Releases toxic soot, toluene, and benzene indoors</text>
        <text x="0" y="90">✗ Rapid, hot uneven burn leading to excessive tunneling</text>
        <text x="0" y="135">✗ Synthetic chemical fragrances that cause headaches</text>
        <text x="0" y="180">✗ Harsh petroleum chemicals damaging home walls &amp; fabrics</text>
      </g>
    </g>
  </g>

  <!-- Core Values Strip -->
  <g id="Core-Values" transform="translate(120, 1380)">
    <rect width="1200" height="220" rx="20" fill="#F6F1EC" stroke="#EAE3D9" />
    
    <!-- Value 1 -->
    <g transform="translate(60, 45)">
      <circle cx="30" cy="30" r="26" fill="#F4E8C1" />
      <text x="30" y="36" text-anchor="middle" class="sans" font-size="18">🌿</text>
      <text x="75" y="25" class="serif" font-size="20" font-weight="700" fill="#231B15">Natural Botanicals</text>
      <text x="75" y="48" class="sans" font-size="12" fill="#786C63" width="240">Pure non-GMO soy beans harvested sustainably.</text>
    </g>

    <!-- Value 2 -->
    <g transform="translate(450, 45)">
      <circle cx="30" cy="30" r="26" fill="#F4E8C1" />
      <text x="30" y="36" text-anchor="middle" class="sans" font-size="18">🕯️</text>
      <text x="75" y="25" class="serif" font-size="20" font-weight="700" fill="#231B15">Artisanal Pouring</text>
      <text x="75" y="48" class="sans" font-size="12" fill="#786C63" width="240">Small-batch hand poured with human oversight.</text>
    </g>

    <!-- Value 3 -->
    <g transform="translate(840, 45)">
      <circle cx="30" cy="30" r="26" fill="#F4E8C1" />
      <text x="30" y="36" text-anchor="middle" class="sans" font-size="18">📦</text>
      <text x="75" y="25" class="serif" font-size="20" font-weight="700" fill="#231B15">Plastic-Free Delivery</text>
      <text x="75" y="48" class="sans" font-size="12" fill="#786C63" width="240">Eco-conscious packaging tailored for gifting.</text>
    </g>
  </g>

  <!-- CTA Banner -->
  <g id="CTA-Banner" transform="translate(120, 1660)">
    <rect width="1200" height="120" rx="20" fill="#231B15" />
    <text x="60" y="68" class="serif" font-size="28" font-weight="700" fill="#FCFBF7">
      Ready to Bring Pure Fragrance Into Your Sanctuary?
    </text>
    <rect x="940" y="36" width="200" height="48" rx="24" fill="#C59B27" />
    <text x="1040" y="66" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#231B15" letter-spacing="1">
      EXPLORE CANDLES →
    </text>
  </g>

  <!-- Footer -->
  <g id="Footer" transform="translate(0, 1850)">
    <rect width="1440" height="250" fill="#231B15" />
    <g transform="translate(100, 50)">
      <text x="0" y="24" class="serif" font-size="24" font-weight="700" fill="#FCFBF7" letter-spacing="2">LIVE LOVE LIGHT</text>
      <text x="0" y="44" class="sans" font-size="10" font-weight="600" fill="#DFBE58" letter-spacing="2">LIGHT SOMETHING BEAUTIFUL</text>
      <line x1="0" y1="130" x2="1240" y2="130" stroke="#3D3027" stroke-width="1" />
      <text x="0" y="165" class="sans" font-size="11" fill="#786C63">
        © 2026 Live Love Light. All rights reserved. Handcrafted in India.
      </text>
    </g>
  </g>
</svg>
