    <text x="0" y="0" class="serif" font-size="30" font-weight="700" fill="#231B15">More Handcrafted Pieces You'll Adore</text>
    
    <g transform="translate(0, 30)">
      <!-- Card A -->
      <rect x="0" y="0" width="385" height="360" rx="18" fill="#FFFFFF" stroke="#EAE3D9" />
      <rect x="14" y="14" width="357" height="200" rx="12" fill="#F6F1EC" />
      <text x="192" y="120" text-anchor="middle" class="serif" font-size="18" font-weight="700" fill="#231B15">DAISY JASMINE</text>
      <text x="24" y="245" class="sans" font-size="10.5" font-weight="700" fill="#9A7513">FLOWER CANDLE</text>
      <text x="24" y="270" class="serif" font-size="20" font-weight="700" fill="#231B15">Daisy Flower Candle</text>
      <text x="24" y="300" class="sans" font-size="18" font-weight="700" fill="#231B15">₹349 <tspan font-size="12" text-decoration="line-through" fill="#9D938B">₹499</tspan></text>

      <!-- Card B -->
      <rect x="427" y="0" width="385" height="360" rx="18" fill="#FFFFFF" stroke="#EAE3D9" />
      <rect x="441" y="14" width="357" height="200" rx="12" fill="#F6F1EC" />
      <text x="619" y="120" text-anchor="middle" class="serif" font-size="18" font-weight="700" fill="#231B15">PEONY OUD</text>
      <text x="451" y="245" class="sans" font-size="10.5" font-weight="700" fill="#9A7513">ROSE CANDLE</text>
      <text x="451" y="270" class="serif" font-size="20" font-weight="700" fill="#231B15">Peony Bloom Candle</text>
      <text x="451" y="300" class="sans" font-size="18" font-weight="700" fill="#231B15">₹449 <tspan font-size="12" text-decoration="line-through" fill="#9D938B">₹649</tspan></text>

      <!-- Card C -->
      <rect x="855" y="0" width="385" height="360" rx="18" fill="#FFFFFF" stroke="#EAE3D9" />
      <rect x="869" y="14" width="357" height="200" rx="12" fill="#F6F1EC" />
      <text x="1047" y="120" text-anchor="middle" class="serif" font-size="18" font-weight="700" fill="#231B15">LOTUS SANDALWOOD</text>
      <text x="879" y="245" class="sans" font-size="10.5" font-weight="700" fill="#9A7513">FLOWER CANDLE</text>
      <text x="879" y="270" class="serif" font-size="20" font-weight="700" fill="#231B15">Lotus Sacred Candle</text>
      <text x="879" y="300" class="sans" font-size="18" font-weight="700" fill="#231B15">₹379 <tspan font-size="12" text-decoration="line-through" fill="#9D938B">₹549</tspan></text>
    </g>
  </g>

  <!-- Footer -->
  <g id="Footer" transform="translate(0, 1800)">
    <rect width="1440" height="300" fill="#231B15" />
    <g transform="translate(100, 50)">
      <text x="0" y="24" class="serif" font-size="24" font-weight="700" fill="#FCFBF7" letter-spacing="2">LIVE LOVE LIGHT</text>
      <text x="0" y="44" class="sans" font-size="10" font-weight="600" fill="#DFBE58" letter-spacing="2">LIGHT SOMETHING BEAUTIFUL</text>
      <line x1="0" y1="180" x2="1240" y2="180" stroke="#3D3027" stroke-width="1" />
      <text x="0" y="215" class="sans" font-size="11" fill="#786C63">
        © 2026 Live Love Light. All rights reserved. Handcrafted in India.
      </text>
    </g>
  </g>
</svg>
