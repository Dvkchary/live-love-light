        </g>
      </g>

      <!-- DIRECT MARKETPLACE ORDER CHANNELS (Primary Call to Action) -->
      <g transform="translate(0, 450)">
        <text x="0" y="0" class="sans" font-size="12" font-weight="700" fill="#231B15" letter-spacing="1">
          CHOOSE YOUR PREFERRED ORDER CHANNEL:
        </text>

        <!-- 1. Amazon Button -->
        <g transform="translate(0, 16)">
          <rect width="600" height="60" rx="16" fill="#231B15" class="card-shadow" />
          <circle cx="36" cy="30" r="14" fill="#FF9900" />
          <text x="36" y="35" text-anchor="middle" class="sans" font-size="12" font-weight="800" fill="#231B15">a</text>
          <text x="65" y="28" class="sans" font-size="14" font-weight="700" fill="#FCFBF7">Buy Directly on Amazon.in</text>
          <text x="65" y="46" class="sans" font-size="11" fill="#DFBE58">Prime Delivery Available • Cash on Delivery • 1-Day Dispatch</text>
          <text x="565" y="36" text-anchor="end" class="sans" font-size="18" fill="#FCFBF7">→</text>
        </g>

        <!-- 2. Flipkart Button -->
        <g transform="translate(0, 88)">
          <rect width="600" height="60" rx="16" fill="#FFFFFF" stroke="#EAE3D9" stroke-width="1.5" />
          <circle cx="36" cy="30" r="14" fill="#2874F0" />
          <text x="36" y="34" text-anchor="middle" class="sans" font-size="10" font-weight="800" fill="#FFFFFF">fk</text>
          <text x="65" y="28" class="sans" font-size="14" font-weight="700" fill="#231B15">Buy on Flipkart</text>
          <text x="65" y="46" class="sans" font-size="11" fill="#786C63">Flipkart Assured • Express Shipping Across India</text>
          <text x="565" y="36" text-anchor="end" class="sans" font-size="18" fill="#231B15">→</text>
        </g>

        <!-- 3. Meesho Button -->
        <g transform="translate(0, 160)">
          <rect width="600" height="60" rx="16" fill="#FFFFFF" stroke="#EAE3D9" stroke-width="1.5" />
          <circle cx="36" cy="30" r="14" fill="#F43397" />
          <text x="36" y="34" text-anchor="middle" class="sans" font-size="10" font-weight="800" fill="#FFFFFF">m</text>
          <text x="65" y="28" class="sans" font-size="14" font-weight="700" fill="#231B15">Buy on Meesho</text>
          <text x="65" y="46" class="sans" font-size="11" fill="#786C63">Best Value Deals • Direct Manufacturer Price</text>
          <text x="565" y="36" text-anchor="end" class="sans" font-size="18" fill="#231B15">→</text>
        </g>
      </g>

      <!-- Specifications Table -->
      <g transform="translate(0, 700)">
        <rect width="600" height="210" rx="16" fill="#FFFFFF" stroke="#EAE3D9" />
        <text x="24" y="32" class="serif" font-size="18" font-weight="700" fill="#231B15">Product Specifications</text>
        
        <line x1="24" y1="46" x2="576" y2="46" stroke="#EAE3D9" />
        
        <text x="24" y="75" class="sans" font-size="12" fill="#786C63">Wax Formulation</text>
        <text x="200" y="75" class="sans" font-size="12" font-weight="600" fill="#231B15">100% Pure Botanical Soy Wax</text>

        <line x1="24" y1="88" x2="576" y2="88" stroke="#F6F1EC" />

        <text x="24" y="112" class="sans" font-size="12" fill="#786C63">Approx. Burn Time</text>
        <text x="200" y="112" class="sans" font-size="12" font-weight="600" fill="#231B15">40 Hours Continuous</text>

        <line x1="24" y1="125" x2="576" y2="125" stroke="#F6F1EC" />

        <text x="24" y="149" class="sans" font-size="12" fill="#786C63">Net Weight</text>
        <text x="200" y="149" class="sans" font-size="12" font-weight="600" fill="#231B15">220 Grams</text>

        <line x1="24" y1="162" x2="576" y2="162" stroke="#F6F1EC" />

        <text x="24" y="186" class="sans" font-size="12" fill="#786C63">Dimensions</text>
        <text x="200" y="186" class="sans" font-size="12" font-weight="600" fill="#231B15">8.5 x 7.0 x 6.0 cm</text>
      </g>
    </g>
  </g>

  <!-- ==================== RELATED ARTISAN CANDLES ==================== -->
