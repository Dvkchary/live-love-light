  <!-- Mobile Footer -->
  <g id="Mobile-Footer" transform="translate(0, 1550)">
    <rect width="390" height="300" fill="#231B15" />
    <g transform="translate(20, 40)">
      <text x="0" y="20" class="serif" font-size="20" font-weight="700" fill="#FCFBF7" letter-spacing="1">LIVE LOVE LIGHT</text>
      <text x="0" y="36" class="sans" font-size="8.5" font-weight="600" fill="#DFBE58" letter-spacing="1.5">LIGHT SOMETHING BEAUTIFUL</text>
      <text x="0" y="65" class="sans" font-size="11" fill="#9D938B">100% Botanical Soy Wax • Hand-Poured in India</text>
      <line x1="0" y1="120" x2="350" y2="120" stroke="#3D3027" stroke-width="1" />
      <text x="0" y="150" class="sans" font-size="10" fill="#786C63">
