      <line x1="0" y1="8" x2="20" y2="8" stroke="#231B15" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="14" x2="20" y2="14" stroke="#231B15" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="20" x2="14" y2="20" stroke="#231B15" stroke-width="2" stroke-linecap="round" />
    </g>
