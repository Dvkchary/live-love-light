      <circle cx="16" cy="16" r="14" fill="#F4E8C1" />
      <path d="M16 8 C17.2 10.8 19.2 13.2 19.2 15.2 C19.2 17.6 17.6 19.6 16 19.6 C14.4 19.6 12.8 17.6 12.8 15.2 C12.8 13.2 14.8 10.8 16 8 Z" fill="#C59B27" />
      <text x="38" y="18" class="serif" font-size="16" font-weight="700" fill="#231B15" letter-spacing="1">LIVE LOVE LIGHT</text>
      <text x="39" y="28" class="sans" font-size="7" font-weight="600" fill="#9A7513" letter-spacing="1.5">HANDCRAFTED CANDLES</text>
