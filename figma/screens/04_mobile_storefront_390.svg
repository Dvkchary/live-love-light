<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1850" width="390" height="1850">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
      .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
      .gold-grad { fill: url(#goldGradient); }
      .card-shadow { filter: drop-shadow(0 3px 8px rgba(45,33,23,0.06)); }
    </style>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B58B1E" />
      <stop offset="50%" stop-color="#D8B244" />
      <stop offset="100%" stop-color="#9B7414" />
    </linearGradient>
  </defs>

  <rect width="390" height="1850" fill="#FCFBF7" />

  <!-- Mobile Top Announcement -->
  <rect width="390" height="32" fill="#231B15" />
  <text x="195" y="20" text-anchor="middle" class="sans" font-size="9" font-weight="600" fill="#FCFBF7" letter-spacing="0.5">
    ✨ 100% PURE SOY WAX • BUY DIRECT ON AMAZON
  </text>

  <!-- Mobile Navbar -->
  <g id="Mobile-Navbar" transform="translate(0, 32)">
    <rect width="390" height="64" fill="#FCFBF7" />
