      <text x="16" y="238" class="sans" font-size="9.5" font-weight="700" fill="#9A7513" letter-spacing="1">ROSE CANDLES • 50H BURN</text>
      <text x="16" y="260" class="serif" font-size="18" font-weight="700" fill="#231B15">Peony Bloom — Jasmine &amp; Oud</text>
      <text x="16" y="280" class="sans" font-size="11" fill="#786C63">Multi-layered peony bloom combining floral &amp; woody aroma.</text>

      <text x="16" y="312" class="sans" font-size="18" font-weight="700" fill="#231B15">₹449</text>
      <text x="65" y="312" class="sans" font-size="12" text-decoration="line-through" fill="#9D938B">₹649</text>

      <!-- Buy CTA -->
      <g transform="translate(16, 335)">
        <rect width="326" height="42" rx="21" fill="#231B15" />
        <text x="163" y="26" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#FCFBF7" letter-spacing="1">
          VIEW &amp; BUY ON AMAZON →
        </text>
      </g>
    </g>
